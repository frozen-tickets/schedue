<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>뮤지컬 겨울왕국 정산판</title>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            background: linear-gradient(180deg, #0b1329 0%, #111e38 100%);
            color: #f1f5f9;
            width: 100%;
            max-width: 393px;
            margin: 0 auto;
            padding: 12px 10px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            padding: 10px 0 4px 0;
        }
        .main-title {
            font-size: 22px;
            font-weight: 800;
            color: #f0f9ff;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.8), 0 0 20px rgba(186, 230, 253, 0.4);
            letter-spacing: -0.5px;
        }
        .contact-info {
            font-size: 9px;
            color: #7dd3fc;
            margin-top: 5px;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        section {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: -0.3px;
        }
        .toggle-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
            font-size: 9.5px;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .toggle-btn:hover {
            background: rgba(56, 189, 248, 0.3);
            color: #ffffff;
        }

        .schedule-wrapper {
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 800px;
            overflow: hidden;
            opacity: 1;
        }
        .schedule-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
        }
        
        .schedule-scroll {
            max-height: 190px;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: 8px;
            -webkit-overflow-scrolling: touch;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table.schedule-table {
            width: 100%;
            min-width: 480px;
            border-collapse: collapse;
            font-size: 9.5px;
            text-align: center;
            table-layout: fixed;
        }
        table.schedule-table th {
            background-color: #0f172a !important;
            color: #38bdf8;
            position: sticky;
            top: 0;
            padding: 7px 2px;
            z-index: 10;
            font-size: 9.5px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.35);
            white-space: nowrap;
            text-align: center;
        }
        table.schedule-table td {
            padding: 6px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 9.5px;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        table.schedule-table td:first-child {
            font-weight: bold;
            color: #e0f2fe;
        }
        table.schedule-table tr:hover td {
            background: rgba(56, 189, 248, 0.18);
        }

        table.schedule-table col.col-date { width: 55px; }
        table.schedule-table col.col-time { width: 42px; }
        table.schedule-table col.col-role { width: calc((100% - 97px) / 6); }

        table.schedule-table th:nth-child(2),
        table.schedule-table td:nth-child(2) {
            border-right: 1px solid rgba(56, 189, 248, 0.3);
        }

        .cast-changed-tag {
            background: #f59e0b;
            color: #000;
            font-size: 7px;
            font-weight: bold;
            padding: 1px 2px;
            border-radius: 3px;
            margin-left: 2px;
            display: inline-block;
            vertical-align: middle;
            box-shadow: 0 0 4px rgba(245, 158, 11, 0.5);
            line-height: 1;
        }

        .actor-filter-container {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
        }
        .filter-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .actor-filter-title {
            font-size: 9.5px;
            color: #bae6fd;
            font-weight: bold;
        }
        .reset-filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-filter-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .role-filter-group {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            gap: 4px;
        }
        .role-label {
            font-size: 8.5px;
            font-weight: bold;
            color: #38bdf8;
            width: auto;
            min-width: 52px;
            padding: 2px 5px;
            flex-shrink: 0;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 4px;
            text-align: center;
            white-space: nowrap;
        }
        .actor-filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            flex: 1;
        }
        .actor-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #cbd5e1;
            font-size: 8.5px;
            padding: 2px 7px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .actor-btn:hover, .actor-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            font-weight: bold;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.5);
        }

        .form-group {
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
        }
        .form-group label {
            font-size: 10px;
            color: #cbd5e1;
            width: 70px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .form-group input, .form-group select {
            flex: 1;
            padding: 5px 7px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            background: #0b1329;
            color: #ffffff;
            font-size: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #38bdf8;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #cbd5e1;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-reset {
            background: #334155;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 9px;
            padding: 5px 8px;
            border-radius: 5px;
            margin-left: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .btn-reset:hover {
            background: #475569;
        }
        .btn-primary {
            width: 100%;
            padding: 9px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            color: white;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
        }

        .summary-info {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 7px 12px;
            border-radius: 6px;
            margin-bottom: 7px;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
        }
        .summary-info strong { color: #38bdf8; font-size: 11px; }
        .record-list {
            list-style: none;
            max-height: 130px;
            overflow-y: auto;
        }
        .record-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 7px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 10px;
            position: relative;
        }
        .record-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .delete-btn {
            position: absolute;
            right: 8px;
            bottom: 5px;
            background: none;
            border: none;
            color: #f87171;
            font-size: 9.5px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-btn:hover {
            color: #ef4444;
        }

        .site-links {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            font-size: 9.5px;
            margin-bottom: 8px;
        }
        .site-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e0f2fe;
            text-decoration: none;
            padding: 5px 7px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .site-item:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .grade-legend {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 8.5px;
            margin-bottom: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px;
            border-radius: 6px;
        }
        .legend-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .g-item { display: flex; align-items: center; gap: 4px; }
        .g-dot { width: 8px; height: 8px; border-radius: 50%; }

        .c-vip { background-color: #d97706; color: #fff; }
        .c-r { background-color: #dc2626; color: #fff; }
        .c-s { background-color: #2563eb; color: #fff; }
        .c-a { background-color: #16a34a; color: #fff; }
        .c-disabled { background-color: #64748b; color: #fff; }
        .c-unassigned { background-color: #475569; color: #94a3b8; }

        .c-watch-1 { background-color: #ec4899 !important; color: #fff !important; }
        .c-watch-2 { background-color: #a855f7 !important; color: #fff !important; }
        .c-watch-3 { background-color: #f97316 !important; color: #fff !important; }

        .stage-box {
            text-align: center;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(14, 165, 233, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #f0f9ff;
            font-size: 9.5px;
            padding: 4px;
            border-radius: 6px;
            margin: 0 auto 8px auto;
            width: 65%;
            letter-spacing: 3px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .floor-label-row {
            display: flex;
            align-items: center;
            gap: 2px;
            width: 100%;
            margin: 6px 0 2px 0;
        }
        .floor-label-space {
            display: flex;
            gap: 1px;
        }
        .floor-label {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 800;
            text-align: center;
            line-height: 1;
            white-space: nowrap;
        }

        .seat-scroll-container {
            width: 100%;
            overflow-x: auto;
            background: rgba(11, 19, 41, 0.9);
            border-radius: 8px;
            padding: 8px 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            -webkit-overflow-scrolling: touch;
        }
        
        .seat-grid-table {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
            align-items: center;
            min-width: 360px;
        }

        .seat-row-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .row-num {
            font-size: 6.5px;
            color: #94a3b8;
            width: 12px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .seat-section-block {
            display: flex;
            gap: 1px;
        }

        .aisle-space {
            width: 6px;
            flex-shrink: 0;
        }

        .seat-cell {
            width: 6.8px;
            height: 7.5px;
            border-radius: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.5);
            transition: background-color 0.2s, transform 0.1s;
        }

        .seat-cell.empty-space {
            background: transparent !important;
            box-shadow: none !important;
            cursor: default;
            pointer-events: none;
        }

        .seat-cell:not(.empty-space):hover {
            transform: scale(2.2);
            z-index: 99;
            box-shadow: 0 0 5px #ffffff;
        }

        .gap-222 {
            margin-right: 4px;
        }

        /* 배우별 정산판 스타일 추가 */
        .actor-board-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 6px;
        }
        .actor-board-group:last-child {
            margin-bottom: 0;
        }
        .actor-board-label {
            font-size: 9px;
            font-weight: bold;
            color: #38bdf8;
            min-width: 55px;
            padding: 3px 6px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 4px;
            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .actor-board-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
        }
        .actor-board-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 9.5px;
            color: #cbd5e1;
            transition: all 0.2s;
        }
        .actor-board-badge.watched {
            background: rgba(2, 132, 199, 0.25);
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: bold;
        }
        .actor-board-badge .count-highlight {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="main-title">뮤지컬 겨울왕국</div>
        <div class="contact-info">문의 시 @zxxinxa 로 연락주세요.</div>
    </header>

    <section>
        <div class="section-header">
            <div class="section-title">☃️ 스케줄</div>
            <button class="toggle-btn" id="toggleScheduleBtn" onclick="toggleSchedule()">접기 ▲</button>
        </div>
        <div class="schedule-wrapper" id="scheduleWrapper">
            <div class="schedule-scroll">
                <table class="schedule-table">
                    <colgroup>
                        <col class="col-date">
                        <col class="col-time">
                        <col class="col-role">
                        <col class="col-role">
                        <col class="col-role">
                        <col class="col-role">
                        <col class="col-role">
                        <col class="col-role">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>일자</th>
                            <th>시간</th>
                            <th>엘사</th>
                            <th>안나</th>
                            <th>크리스토프</th>
                            <th>한스</th>
                            <th>올라프</th>
                            <th>위즐튼</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
            
            <div class="actor-filter-container">
                <div class="filter-top-bar">
                    <span class="actor-filter-title">🔍 배우 스케줄 필터</span>
                    <button class="reset-filter-btn" onclick="resetActorFilters()">필터 초기화</button>
                </div>
                <div id="roleFilterContainer"></div>
            </div>
        </div>
    </section>

    <section>
        <div class="section-header" style="border:none; margin:0; padding:0;">
            <div class="section-title" style="margin-bottom:6px;">🎟️ 관람 정보 입력</div>
        </div>
        <div class="form-group">
            <label>관람 일시</label>
            <input type="text" id="watchDate" placeholder="스케줄 표에서 선택" readonly>
        </div>
        <div class="form-group">
            <label>선택 좌석</label>
            <input type="text" id="selectSeat" placeholder="배치도에서 좌석 클릭">
        </div>
        <div class="form-group">
            <label>좌석 등급</label>
            <select id="seatGrade" onchange="updatePrice()">
                <option value="190000">VIP석 (190,000원)</option>
                <option value="160000">R석 (160,000원)</option>
                <option value="130000">S석 (130,000원)</option>
                <option value="90000">A석 (90,000원)</option>
            </select>
        </div>
        <div class="form-group">
            <label>할인 권종</label>
            <select id="discountType" onchange="updatePrice()">
                <option value="0" data-count="1">정가</option>
                <option value="0" data-count="1">타임세일</option>
                <option value="0.05" data-count="3">3인 패키지 (5%)</option>
                <option value="0.10" data-count="4">4인 패키지 (10%)</option>
                <option value="0.30" data-count="1">국가유공자 (본인만 30%)</option>
                <option value="0.30" data-count="1">장애인 (동반 1인까지 30%)</option>
            </select>
        </div>
        <div class="form-group">
            <label>수수료 설정</label>
            <label class="checkbox-label">
                <input type="checkbox" id="includeFee" checked onchange="updatePrice()"> 예매 수수료 포함 (장당 2,000원)
            </label>
        </div>
        <div class="form-group">
            <label>최종 결제액</label>
            <input type="number" id="finalPriceInput" placeholder="직접 수정 가능" style="color:#38bdf8; font-weight:bold;">
            <button type="button" class="btn-reset" onclick="resetPrice()">복원</button>
        </div>
        <button class="btn-primary" onclick="addRecord()">티켓 저장</button>
    </section>

    <section>
        <div class="section-header" style="border:none; margin:0; padding:0;">
            <div class="section-title" style="margin-bottom:6px;">❄️ 관극 정산 기록</div>
        </div>
        <div class="summary-info">
            <div>관극 횟수: <strong id="totalCount">0</strong>회</div>
            <div>총 정산 금액: <strong id="totalAmount">0</strong>원</div>
        </div>
        <div class="record-list" id="recordContainer"></div>
    </section>

    <section>
        <div class="section-header" style="border:none; margin:0; padding:0;">
            <div class="section-title" style="margin-bottom:6px;">👑 예매처 및 등급별 좌석배치도</div>
        </div>
        
        <div class="site-links">
            <a href="https://www.charlottetheater.co.kr/m/performence/current.asp" target="_blank" class="site-item">
                <span>샤롯데</span>
                <span>↗</span>
            </a>
            <a href="https://mobileticket.interpark.com/goods/26007416?app_tapbar_state=hide" target="_blank" class="site-item">
                <span>NOL티켓</span>
                <span>↗</span>
            </a>
            <a href="https://m.ticket.yes24.com/Perf/58563" target="_blank" class="site-item">
                <span>예스24</span>
                <span>↗</span>
            </a>
        </div>

        <div class="grade-legend">
            <div class="legend-row">
                <div class="g-item"><div class="g-dot c-vip"></div><span>VIP</span></div>
                <div class="g-item"><div class="g-dot c-r"></div><span>R</span></div>
                <div class="g-item"><div class="g-dot c-s"></div><span>S</span></div>
                <div class="g-item"><div class="g-dot c-a"></div><span>A</span></div>
                <div class="g-item"><div class="g-dot c-disabled"></div><span>휠체어/미판매</span></div>
            </div>
            <div class="legend-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; margin-top: 2px;">

        function calculateAutoPrice() {
            const gradePrice = parseInt(document.getElementById('seatGrade').value) || 0;
            const discountSelect = document.getElementById('discountType');
            const discountRate = parseFloat(discountSelect.value) || 0;
            const ticketCount = parseInt(discountSelect.options[discountSelect.selectedIndex].getAttribute('data-count') || '1');
            const includeFee = document.getElementById('includeFee').checked;
            const feePerTicket = includeFee ? 2000 : 0;

            const baseTotal = gradePrice * ticketCount;
            return Math.floor(baseTotal * (1 - discountRate)) + (feePerTicket * ticketCount);
        }

        function updatePrice() {
            const calculated = calculateAutoPrice();
            document.getElementById('finalPriceInput').value = calculated;
            return calculated;
        }

            const dateVal = document.getElementById('watchDate').value;

            if (!dateVal || !seatVal) {
                alert('관람 일시와 좌석을 선택해 주세요.');
                return;
            }

            const record = {
                id: Date.now(),
                datetime: dateVal,
                seat: seatVal,
                price: priceVal
            };

            myRecords.push(record);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            
            const seatKey = seatVal.split(' (')[0];
            const currentCount = seatWatchStatus[seatKey] || 0;
            seatWatchStatus[seatKey] = currentCount + 1;
            localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));

            renderRecords();
            buildGradeSeatMap();
            renderActorBoard();
            document.getElementById('selectSeat').value = '';

            document.getElementById('totalAmount').innerText = total.toLocaleString();

        function deleteRecord(id) {
            const target = myRecords.find(r => r.id === id);
            if (target) {
                const seatKey = target.seat.split(' (')[0];
                if (seatWatchStatus[seatKey] && seatWatchStatus[seatKey] > 0) {
                    seatWatchStatus[seatKey] -= 1;
                    if (seatWatchStatus[seatKey] === 0) delete seatWatchStatus[seatKey];
                    localStorage.setItem('frozenSeatWatchStatus', JSON.stringify(seatWatchStatus));
                }
            }
            myRecords = myRecords.filter(r => r.id !== id);
            localStorage.setItem('frozenCalcRecords', JSON.stringify(myRecords));
            renderRecords();
            buildGradeSeatMap();
            renderActorBoard();
        }

        // 배우별 정산판 렌더링 함수
        function renderActorBoard() {
            const container = document.getElementById('actorBoardContainer');
            if (!container) return;
            container.innerHTML = '';

            // 1. 전체 스케줄에서 각 배우별 총 출연 회차 집계
            const totalCastCount = {};
            roleCastMap.forEach(r => {
                r.actors.forEach(actor => {
                    totalCastCount[actor] = 0;
                });
            });

            fullSchedule.forEach(s => {
                roleCastMap.forEach(r => {
                    const actorName = s[r.key];
                    if (totalCastCount[actorName] !== undefined) {
                        totalCastCount[actorName]++;
                    }
                });
            });

            // 2. 저장된 내 관람 기록(myRecords)에서 관람 일시를 파싱하여 배우별 본 횟수 집계
            const myWatchedCount = {};
            roleCastMap.forEach(r => {
                r.actors.forEach(actor => {
                    myWatchedCount[actor] = 0;
                });
            });

            myRecords.forEach(rec => {
                const datePart = rec.datetime.split(' ')[0]; // 예: "2026-08-09(일)"
                const timePart = rec.datetime.split(' ')[1]; // 예: "19:00"
                const pureDate = datePart.split('(')[0];

                const foundCast = fullSchedule.find(s => s.date === pureDate && s.time === timePart);
                if (foundCast) {
                    roleCastMap.forEach(r => {
                        const actorName = foundCast[r.key];
                        if (myWatchedCount[actorName] !== undefined) {
                            myWatchedCount[actorName]++;
                        }
                    });
                }
            });

            // 3. 정산판 UI 생성
            roleCastMap.forEach(r => {
                const group = document.createElement('div');
                group.className = 'actor-board-group';

                const label = document.createElement('div');
                label.className = 'actor-board-label';
                label.innerText = r.role;
                group.appendChild(label);

                const list = document.createElement('div');
                list.className = 'actor-board-list';

                r.actors.forEach(actor => {
                    const watched = myWatchedCount[actor] || 0;
                    const total = totalCastCount[actor] || 0;

                    const badge = document.createElement('div');
                    badge.className = `actor-board-badge ${watched > 0 ? 'watched' : ''}`;
                    badge.innerHTML = `${actor} (<span class="count-highlight">${watched}</span>/${total})`;
                    list.appendChild(badge);
                });

                group.appendChild(list);
                container.appendChild(group);
            });
        }

        function createRange(start, end, excludes = []) {
            const arr = [];
            for (let i = start; i <= end; i++) {
                if (excludes.includes(i)) continue;
                arr.push(i);
            }
            return arr;
        }

        function splitSeatRow(nums) {
            const a = [], b = [], c = [];
            nums.forEach(n => {
                if (typeof n === 'number') {
                    if (n <= 14) a.push(n);
                    else if (n <= 30) b.push(n);
                    else c.push(n);
                } else {
                    if (n.refNum <= 14) a.push(n);
                    else if (n.refNum <= 30) b.push(n);
                    else c.push(n);
                }
            });
            return { a, b, c };
        }

                { row: '11', range: createRange(1, 44) },
                { row: '12', range: range12F }
            ];

            const data2F = raw2F.map(item => {
                const split = splitSeatRow(item.range);
                return {
                    row: item.row,

        function getGradeFromImage(floor, row, num) {

                if (row === 'OP') {

                    return { cls: 'c-vip', label: 'VIP석' };

                const rNum = parseInt(row);

                if (row === '1' && ((num >= 12 && num <= 14) || (num >= 31 && num <= 33))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '2' && ((num >= 11 && num <= 12) || (num >= 33 && num <= 34))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '3' && ((num >= 10 && num <= 11) || (num >= 34 && num <= 35))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '4' && ((num >= 9 && num <= 10) || (num >= 35 && num <= 36))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '5' && ((num >= 8 && num <= 9) || (num >= 36 && num <= 37))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '6' || row === '7') && ((num >= 7 && num <= 8) || (num >= 37 && num <= 38))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '8' && ((num >= 6 && num <= 7) || (num >= 38 && num <= 39))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '9' || row === '10') && ((num >= 5 && num <= 6) || (num >= 39 && num <= 40))) return { cls: 'c-unassigned', label: '미판매석' };
                if (row === '11' && ((num >= 4 && num <= 5) || (num >= 40 && num <= 41))) return { cls: 'c-unassigned', label: '미판매석' };
                if ((row === '12' || row === '13') && ((num >= 3 && num <= 4) || (num >= 41 && num <= 42))) return { cls: 'c-unassigned', label: '미판매석' };

                if (row === '20' && ((num >= 9 && num <= 14) || (num >= 31 && num <= 37))) {
                    return { cls: 'c-disabled', label: '장애인석' };
                }

                if (rNum >= 1 && rNum <= 18) {
                    if (num >= 8 && num <= 37) return { cls: 'c-vip', label: 'VIP석' };
                    return { cls: 'c-r', label: 'R석' };
                }
                return { cls: 'c-r', label: 'R석' };
            }

            if (floor === '2층') {
                const rNum = parseInt(row);

                if (row === '1' && [2, 3, 4, 41, 42, 43].includes(num)) {
                    return { cls: 'c-unassigned', label: '미판매석' };
                }

                if (row === '1') {
                    if ((num >= 5 && num <= 8) || (num >= 37 && num <= 40)) return { cls: 'c-r', label: 'R석' };
                    return { cls: 'c-vip', label: 'VIP석' };
                }

                if (row === '2') {
                    if ((num >= 2 && num <= 8) || (num >= 37 && num <= 43)) return { cls: 'c-r', label: 'R석' };
                    return { cls: 'c-vip', label: 'VIP석' };
                }

                if (rNum >= 3 && rNum <= 5) return { cls: 'c-r', label: 'R석' };
                if (rNum >= 6 && rNum <= 10) return { cls: 'c-s', label: 'S석' };
                if (rNum >= 11 && rNum <= 12) return { cls: 'c-a', label: 'A석' };
            }

            return { cls: 'c-vip', label: 'VIP석' };
        }

        function createFloorLabelRow(floorText) {
            const rowWrapper = document.createElement('div');
            rowWrapper.className = 'floor-label-row';

            const dummyNum = document.createElement('div');
            dummyNum.className = 'row-num';
            rowWrapper.appendChild(dummyNum);

            const secA = document.createElement('div');
            secA.className = 'floor-label-space';
            secA.style.width = '109.2px';
            rowWrapper.appendChild(secA);

            const aisle1 = document.createElement('div');
            aisle1.className = 'aisle-space';
            rowWrapper.appendChild(aisle1);

            const secB = document.createElement('div');
            secB.className = 'floor-label-space';
            secB.style.alignItems = 'center';

            const bLeft = document.createElement('div');
            bLeft.style.width = '62.4px';
            secB.appendChild(bLeft);

            const labelCell = document.createElement('div');
            labelCell.className = 'floor-label';
            labelCell.innerText = floorText;
            secB.appendChild(labelCell);

            const bRight = document.createElement('div');
            bRight.style.width = '62.4px';
            secB.appendChild(bRight);

            rowWrapper.appendChild(secB);

            const aisle2 = document.createElement('div');
            aisle2.className = 'aisle-space';
            rowWrapper.appendChild(aisle2);

            const secC = document.createElement('div');
            secC.className = 'floor-label-space';
            secC.style.width = '109.2px';
            rowWrapper.appendChild(secC);

            return rowWrapper;
        }

        function renderFloorRows(targetElem, floorData, floorTitle, floorLabelText) {
            targetElem.innerHTML = '';

            targetElem.appendChild(createFloorLabelRow(floorLabelText));

            floorData.forEach(rData => {
                const rowWrapper = document.createElement('div');
                rowWrapper.className = 'seat-row-wrapper';

                const rowNum = document.createElement('div');
                rowNum.className = 'row-num';
                rowNum.innerText = rData.row;
                rowWrapper.appendChild(rowNum);

                ['a', 'b', 'c'].forEach((secKey, idx) => {
                    const secBlock = document.createElement('div');
                    secBlock.className = 'seat-section-block';

                    const secName = secKey === 'a' ? 'A구역' : (secKey === 'b' ? 'B구역' : 'C구역');
                    const seatArr = rData[secKey];

                    seatArr.forEach((item, sIdx) => {
                        const cell = document.createElement('div');
                        
                        if (typeof item === 'object' && item.isEmpty) {
                            cell.className = 'seat-cell empty-space';
                            secBlock.appendChild(cell);
                            return;
                        }

                        const num = item;
                        const gInfo = getGradeFromImage(floorTitle, rData.row, num);
                        const seatKey = `${floorTitle} ${secName} ${rData.row}열 ${num}번`;
                        
                        const watchCount = seatWatchStatus[seatKey] || 0;
                        let watchClass = '';
                        if (watchCount === 1) watchClass = 'c-watch-1';
                        else if (watchCount === 2) watchClass = 'c-watch-2';
                        else if (watchCount >= 3) watchClass = 'c-watch-3';

                        cell.className = `seat-cell ${watchClass || gInfo.cls}`;
                        if (rData.isGrouped222 && (sIdx === 1 || sIdx === 3)) {
                            cell.classList.add('gap-222');
                        }
                        cell.innerText = num;

                        cell.onclick = () => {
                            document.getElementById('selectSeat').value = `${seatKey} (${gInfo.label})`;
                            
                            const selectGrade = document.getElementById('seatGrade');
                            if (gInfo.label === 'VIP석') selectGrade.value = '190000';
                            else if (gInfo.label === 'R석') selectGrade.value = '160000';
                            else if (gInfo.label === 'S석') selectGrade.value = '130000';
                            else if (gInfo.label === 'A석') selectGrade.value = '90000';
                            updatePrice();
                        };

                        secBlock.appendChild(cell);
                    });

                    rowWrapper.appendChild(secBlock);

                    if (idx < 2) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle-space';
                        rowWrapper.appendChild(aisle);
                    }
                });

                targetElem.appendChild(rowWrapper);
            });
        }
    </script>
